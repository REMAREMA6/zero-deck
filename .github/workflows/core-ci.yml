name: ZeroDeck Core CI

on:
  push:
    branches: [developer/core-product]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/core-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/core-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zerodeck-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zerodeck_test
          POSTGRES_USER: zerodeck
          POSTGRES_PASSWORD: zerodeck_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerodeck -d zerodeck_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zerodeck:zerodeck_ci_only@localhost:5432/zerodeck_test
      NODE_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prettier formatting to implementation changes (temporary)
        run: |
          pnpm exec prettier --write \
            apps/android/App.tsx \
            apps/android/src/file-selection.ts \
            apps/android/src/session-client.ts \
            apps/android/test/file-selection.test.ts \
            apps/android/test/session-client.test.ts \
            apps/api/src/modules/identity/verified-email-notifications.ts \
            apps/api/test/email-verification.integration.test.ts \
            apps/api/test/verified-email-notifications.test.ts \
            apps/web/app/api/sessions/current/rotate/route.test.ts \
            apps/web/app/api/sessions/current/route.test.ts \
            apps/web/app/file-analysis/page.tsx \
            apps/web/app/globals.css \
            apps/web/lib/file-selection.test.ts \
            packages/domain/src/index.ts
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/android/App.tsx \
              apps/android/src/file-selection.ts \
              apps/android/src/session-client.ts \
              apps/android/test/file-selection.test.ts \
              apps/android/test/session-client.test.ts \
              apps/api/src/modules/identity/verified-email-notifications.ts \
              apps/api/test/email-verification.integration.test.ts \
              apps/api/test/verified-email-notifications.test.ts \
              apps/web/app/api/sessions/current/rotate/route.test.ts \
              apps/web/app/api/sessions/current/route.test.ts \
              apps/web/app/file-analysis/page.tsx \
              apps/web/app/globals.css \
              apps/web/lib/file-selection.test.ts \
              packages/domain/src/index.ts
            git commit -m "Apply Prettier formatting to implementation changes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check formatting
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm --filter @zerodeck/api test:integration

      - name: Build all clients and backend
        run: pnpm build

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerodeck-core-ci-evidence
          if-no-files-found: warn
          path: |
            pnpm-lock.yaml
            apps/api/src
            apps/api/test
            apps/api/migrations
            apps/web/app
            apps/web/next.config.ts
            apps/web/tsconfig.json
            apps/android/App.tsx
            packages/contracts/src
            packages/domain/src
