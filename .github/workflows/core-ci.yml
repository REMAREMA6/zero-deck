name: ZeroDeck Core CI

on:
  push:
    branches: [developer/core-product]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/core-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/core-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zerodeck-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zerodeck_test
          POSTGRES_USER: zerodeck
          POSTGRES_PASSWORD: zerodeck_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerodeck -d zerodeck_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zerodeck:zerodeck_ci_only@localhost:5432/zerodeck_test
      NODE_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Persist dependency lockfile
        if: github.event_name == 'push'
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet -- pnpm-lock.yaml; then
            echo 'Dependency lockfile is unchanged.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add Web cookie boundary tests"
          git fetch origin developer/core-product
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/developer/core-product

      - name: Format source files
        run: pnpm exec prettier --write "apps/**/*.{ts,tsx,js,jsx,json,css,yml,yaml}" "packages/**/*.{ts,tsx,js,jsx,json}"

      - name: Check formatting
        run: pnpm lint

      - name: Persist formatted source
        if: github.event_name == 'push'
        run: |
          git add apps packages
          if git diff --cached --quiet; then
            echo 'Source formatting is already committed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Web cookie boundary tests"
          git fetch origin developer/core-product
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/developer/core-product

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm --filter @zerodeck/api test:integration

      - name: Build all clients and backend
        run: pnpm build

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerodeck-core-ci-evidence
          if-no-files-found: warn
          path: |
            pnpm-lock.yaml
            apps/api/src
            apps/api/test
            apps/api/migrations
            apps/web/app
            apps/web/next.config.ts
            apps/web/tsconfig.json
            apps/android/App.tsx
            packages/contracts/src
            packages/domain/src
