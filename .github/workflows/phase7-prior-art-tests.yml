name: Phase 7 — Pinned Prior-Art Runtime Tests
# Owner-authorized scoped test run; see the Phase 7 authorization record.

on:
  push:
    paths:
      - ".github/workflows/phase7-prior-art-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-prior-art-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hypatia-android:
    name: Hypatia — lint, unit tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout investigation repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout pinned Hypatia source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MaintainTeam/Hypatia
          ref: c0f98977be935e58849726313635a2459cac3892
          path: targets/Hypatia
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Record target and runner
        working-directory: targets/Hypatia
        run: |
          git rev-parse HEAD
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          uname -a
      - name: Install Android SDK components
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Diagnose pinned Kotlin plugin marker checksum
        run: |
          set -eu
          url="https://plugins.gradle.org/m2/org/jetbrains/kotlin/android/org.jetbrains.kotlin.android.gradle.plugin/2.0.21/org.jetbrains.kotlin.android.gradle.plugin-2.0.21.pom"
          curl --fail --silent --show-error --location "$url" --output /tmp/kotlin-plugin-marker.pom
          echo "Pinned expected SHA-256 from Hypatia verification-metadata.xml:"
          echo "61ffa87244c72230adcfc32279d4a1cc41712c2bc5eb50971b630ed880de485f"
          echo "Downloaded artifact SHA-256:"
          sha256sum /tmp/kotlin-plugin-marker.pom
      - name: Run lint, unit tests and debug APK build
        working-directory: targets/Hypatia
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug
      - name: Upload Hypatia reports and APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase7-hypatia-build-evidence
          path: |
            targets/Hypatia/app/build/reports/
            targets/Hypatia/app/build/test-results/
            targets/Hypatia/app/build/outputs/apk/debug/
            targets/Hypatia/build/reports/dependency-verification/
          if-no-files-found: warn
          retention-days: 14

  hypatiadatabases-build:
    name: HypatiaDatabases — bounded Maven build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout investigation repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout pinned HypatiaDatabases source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MaintainTeam/HypatiaDatabases
          ref: 3c35f52e1a847caed46d8e1ad34968bfa3c8b10a
          path: targets/HypatiaDatabases
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: targets/HypatiaDatabases/pom.xml
      - name: Run bounded Maven test/package lifecycle
        working-directory: targets/HypatiaDatabases
        run: |
          git rev-parse HEAD
          java -version
          mvn --batch-mode --no-transfer-progress clean test package
      - name: Run generator against deterministic harmless fixtures
        working-directory: targets/HypatiaDatabases
        run: |
          set -euxo pipefail
          mkdir -p fixture/input fixture/exclusions fixture/extras fixture/production
          printf '%s\n' "0123456789abcdef0123456789abcdef" > fixture/input/fixture.md5
          printf '%s\n' "0123456789abcdef0123456789abcdef01234567" > fixture/input/fixture.sha1
          printf '%s\n' "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" > fixture/input/fixture.sha256
          printf '%s\n' "example.invalid" > fixture/domains.txt
          mvn --batch-mode --no-transfer-progress dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          java -Xmx1g -cp "target/classes:$(cat target/classpath.txt)" org.maintainteam.hypatiadatabases.App "fixture/input/" "fixture/domains.txt" | tee fixture/generator.log
          grep -F "Lines read: valid: 3, invalid: 0" fixture/generator.log
          grep -F "Read count: md5: 1, sha1: 1, sha256: 1, domains: 1" fixture/generator.log
          test -s fixture/input/hypatia-md5-bloom.bin
          test -s fixture/input/hypatia-sha1-bloom.bin
          test -s fixture/input/hypatia-sha256-bloom.bin
          test -s fixture/input/hypatia-domains-bloom.bin
      - name: Upload Maven reports and package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase7-hypatiadatabases-maven-evidence
          path: |
            targets/HypatiaDatabases/target/surefire-reports/
            targets/HypatiaDatabases/target/*.jar
            targets/HypatiaDatabases/fixture/
          if-no-files-found: warn
          retention-days: 14

  clamav-build-test:
    name: ClamAV — CMake build and CTest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout investigation repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout pinned ClamAV source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Cisco-Talos/clamav
          ref: cad7b18a3e6505195fe08db1412449a18fc9f012
          path: targets/clamav
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex gperf pkg-config python3 python3-pip python3-pytest \
            build-essential cmake ninja-build rustc cargo valgrind \
            libbz2-dev zlib1g-dev libxml2-dev libpcre2-dev libssl-dev \
            libjson-c-dev libcurl4-openssl-dev libmspack-dev libncurses-dev \
            check libsystemd-dev
      - name: Record target and toolchain
        working-directory: targets/clamav
        run: |
          git rev-parse HEAD
          cmake --version
          gcc --version
          rustc --version
          python3 --version
      - name: Configure ClamAV
        working-directory: targets/clamav
        run: |
          cmake -S . -B build -G Ninja \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D ENABLE_TESTS=ON \
            -D ENABLE_MILTER=OFF
      - name: Build ClamAV
        working-directory: targets/clamav
        run: cmake --build build --parallel 2
      - name: Run CTest suite
        working-directory: targets/clamav
        run: ctest --test-dir build --output-on-failure -C RelWithDebInfo
      - name: Upload CTest and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase7-clamav-build-test-evidence
          path: |
            targets/clamav/build/Testing/Temporary/
            targets/clamav/build/CTestTestfile.cmake
          if-no-files-found: warn
          retention-days: 14
