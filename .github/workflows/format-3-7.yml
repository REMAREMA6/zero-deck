name: Temporary ZeroDeck formatter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-3-7.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format task 3.7 implementation
        run: >-
          pnpm exec prettier --write
          apps/api/src/modules/authorization/authorization.ts
          apps/api/src/modules/authorization/protected-work.ts
          apps/api/src/modules/website/url-checking.ts
          apps/api/test/url-checking.integration.test.ts
      - name: Commit formatter output to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/authorization/authorization.ts apps/api/src/modules/authorization/protected-work.ts apps/api/src/modules/website/url-checking.ts apps/api/test/url-checking.integration.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: format protected work revocation implementation"
          git push origin HEAD:main
