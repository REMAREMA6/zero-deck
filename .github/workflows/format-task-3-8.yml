name: One-time task 3.8 formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-task-3-8.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/test/account-deletion.integration.test.ts
      - name: Commit formatted test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/account-deletion.integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(test): format account deletion integration tests"
            git push origin main
          fi
