name: One-time task 3.8 formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-task-3-8.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format task 3.8 files
        run: >-
          pnpm exec prettier --write
          apps/android/App.tsx
          apps/api/src/modules/identity/account-deletion-routes.ts
          apps/api/test/account-deletion.integration.test.ts
          apps/web/app/account/page.tsx
      - name: Commit formatted files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/App.tsx apps/api/src/modules/identity/account-deletion-routes.ts apps/api/test/account-deletion.integration.test.ts apps/web/app/account/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format account deletion implementation"
            git push origin main
          fi
