name: One-time obsolete branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-obsolete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged development and bootstrap refs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/developer%2Fcore-product"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/automation%2Fopenspec-bootstrap"
