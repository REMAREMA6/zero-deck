name: Temporary URL test formatting diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/test/url-checking.integration.test.ts'
      - '.github/workflows/temporary-url-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/test/url-checking.integration.test.ts
      - run: cat apps/api/test/url-checking.integration.test.ts
