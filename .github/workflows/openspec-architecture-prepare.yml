name: Validate ZeroDeck OpenSpec architecture

on:
  push:
    branches: [automation/openspec-bootstrap]
    paths: [.github/workflows/openspec-architecture-prepare.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openspec-architecture-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out architecture branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install OpenSpec CLI
        run: |
          npm install --global @fission-ai/openspec@latest
          openspec --version

      - name: Validate all OpenSpec artifacts and inspect workspace
        run: |
          set -o pipefail
          openspec validate --all 2>&1 | tee openspec-validation.log
          openspec status --change core-product-architecture --json | tee openspec-change-status.json
          openspec doctor 2>&1 | tee openspec-doctor.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerodeck-openspec-validation
          if-no-files-found: warn
          path: |
            openspec-validation.log
            openspec-change-status.json
            openspec-doctor.log
